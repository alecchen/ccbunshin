name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/ccbunshin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            asset: ccbunshin-linux-amd64
          - goarch: arm64
            asset: ccbunshin-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build Linux binary
        env:
          GOARCH: ${{ matrix.goarch }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go -C cmd/ccbunshin build -trimpath -ldflags='-s -w' -o "../../${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-${{ github.sha }}
          path: ${{ matrix.asset }}
          retention-days: 14
