name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/ccbunshin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: ccbunshin-linux-amd64
          - goos: linux
            goarch: arm64
            asset: ccbunshin-linux-arm64
          - goos: darwin
            goarch: amd64
            asset: ccbunshin-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: ccbunshin-darwin-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
      - name: Resolve version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) v="${GITHUB_REF#refs/tags/}" ;;
            *) v="dev" ;;
          esac
          echo "CCBUNSHIN_BUILD_VERSION=$v" >> "$GITHUB_ENV"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go -C cmd/ccbunshin build -trimpath -ldflags="-s -w -X main.version=${CCBUNSHIN_BUILD_VERSION}" -o "../../${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}-${{ github.sha }}
          path: ${{ matrix.asset }}
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Server-side publish gate: the job waits here for a required reviewer, so no
    # Release is created without a human. This is the only layer that survives
    # --no-verify, a hook that did not load, or a script that pushes.
    #
    # The environment must be configured with required reviewers in
    # Settings -> Environments. Referencing a name that does not exist will
    # auto-create an unprotected environment, and the gate will silently do
    # nothing. Do NOT enable "Prevent self-review": pushes carry the maintainer's
    # identity, so that would leave the release unapprovable.
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ccbunshin-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
