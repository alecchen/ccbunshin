name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  # Layer 5 of the publish-gating harness (docs/HARNESS_PUBLISH_GATING.md): the
  # PreToolUse hook only sees the command Claude Code runs, so `bash deploy.sh`
  # is invisible to it. This scans tracked scripts for a publish command written
  # literally into one, which is the static half of that gap. It is a separate
  # job so it can be made a required status check, and it is deliberately not a
  # replacement for the `release` job's required-reviewer environment below -
  # that one is server-side and survives everything this scan cannot see.
  publish-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The scan first, so a real offender fails with the scanner's own
      # file:line message rather than a test assertion. Then the scanner's
      # regression tests, which are what catch the scanner itself going blind.
      - run: sh tests/publish-scan.sh
      - run: sh tests/publish-scan-test.sh

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/ccbunshin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: ccbunshin-linux-amd64
          - goos: linux
            goarch: arm64
            asset: ccbunshin-linux-arm64
          - goos: darwin
            goarch: amd64
            asset: ccbunshin-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: ccbunshin-darwin-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
      - name: Resolve version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) v="${GITHUB_REF#refs/tags/}" ;;
            *) v="dev" ;;
          esac
          echo "CCBUNSHIN_BUILD_VERSION=$v" >> "$GITHUB_ENV"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go -C cmd/ccbunshin build -trimpath -ldflags="-s -w -X main.version=${CCBUNSHIN_BUILD_VERSION}" -o "../../${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}-${{ github.sha }}
          path: ${{ matrix.asset }}
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Server-side publish gate: the job waits here for a required reviewer, so no
    # Release is created without a human. This is the only layer that survives
    # --no-verify, a hook that did not load, or a script that pushes.
    #
    # The environment must be configured with required reviewers in
    # Settings -> Environments. Referencing a name that does not exist will
    # auto-create an unprotected environment, and the gate will silently do
    # nothing. Do NOT enable "Prevent self-review": pushes carry the maintainer's
    # identity, so that would leave the release unapprovable.
    environment: release
    steps:
      # Full history and tags: release-notes.sh resolves the previous tag with
      # `git describe`, which the default shallow, tagless clone cannot do.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The bullet list, then the compare link. Written to a file rather than
      # passed inline because the body is multi-line.
      - name: Generate release notes
        run: sh tests/release-notes.sh > RELEASE_NOTES.md
      - uses: actions/download-artifact@v8
        with:
          pattern: ccbunshin-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          # Deliberately not generate_release_notes: that builds its list from
          # merged pull requests, and this repo commits to main directly, so it
          # would add nothing but a second copy of the compare link.
          body_path: RELEASE_NOTES.md
          files: dist/*
